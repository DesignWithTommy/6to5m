[package]
name = "sixng-core"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
texture2ddecoder = "0.1.2"
regex = "1.13.2"
opus-decoder = "0.1.1"
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "5bf5cc56ed56f1ababf1f9592300bd182ff90bd8" }
