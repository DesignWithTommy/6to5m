[package]
name = "rpf9"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unified RPF9 toolkit: extract, carve, audio, textures, models"
readme = "README.md"
keywords = ["rpf", "archive", "extract", "carving"]
categories = ["command-line-utilities"]

[dependencies]
bcpack = { package = "bcpack-rs", git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "5bf5cc56ed56f1ababf1f9592300bd182ff90bd8" }
flate2 = "1"
opus-decoder = "0.1.1"
sixng-core = { path = "vendor/sixng-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
rayon = "1.10"
regex = "1.13.2"
memchr = "2"
memmap2 = "0.9"
png = "0.18.1"
sha2 = "0.11.1"
texture2ddecoder = "0.1.2"
texpresso = "2.0.2"
meshopt-rs = { version = "0.1.2", features = ["experimental"] }

[profile.release]
# thin LTO + parallel codegen: builds several times faster than fat LTO
# with codegen-units = 1, for a few percent of runtime speed
lto = "thin"
codegen-units = 16
strip = true

[[bin]]
name = "6ixpack"
path = "src/main.rs"
